name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for PyPI Trusted Publishing (OIDC). No token anywhere.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade build twine packaging

      # Guard: PyPI versions can never be reused. Fail before upload, not after.
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python - "$TAG" "$PROJ" <<'PY'
          import sys
          from packaging.version import Version
          tag, proj = sys.argv[1], sys.argv[2]
          if Version(tag) != Version(proj):
              sys.exit(f"Tag '{tag}' != pyproject version '{proj}'. Fix one of them and retag.")
          print(f"OK: {tag} == {proj}  (PyPI will see {Version(proj)})")
          PY

      - run: python -m build

      - run: python -m twine check dist/*

      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import otwin; print('import OK, exports:', len([n for n in dir(otwin) if not n.startswith('_')]))"

      - uses: pypa/gh-action-pypi-publish@release/v1
