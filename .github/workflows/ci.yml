name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -ra --cov=otwin_hybrid --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage reporting must never be the reason a build goes red. A
          # flaky upload or a missing token says nothing about the code.
          fail_ci_if_error: false
        if: matrix.python-version == '3.12'

  quality:
    name: lint / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  # The README says every number in it comes from these two commands. This job
  # is what makes that a fact rather than a promise: it regenerates results/
  # from scratch and fails if anything moved. `git diff --exit-code` on the CSVs
  # is deliberately strict — a changed digit is either a regression or a change
  # the README has not caught up with, and both deserve a red build.
  reproduce:
    name: regenerate every number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Keep a copy of the committed numbers
        run: cp -r results results_committed
      - name: Recompute
        run: python -m otwin_hybrid.comparison
      - name: Every number must reproduce to one part in a million
        # Not `git diff --exit-code`. That asserted byte-identical CSVs, which
        # is a claim about floating point rather than about this code: the
        # OpenBLAS inside the numpy and scipy wheels dispatches on the CPU it
        # finds, so the last digits move between machines even on pinned
        # versions. See scripts/compare_results.py.
        run: python scripts/compare_results.py results_committed results
      - name: Redraw
        run: python -m otwin_hybrid.figures
      - name: Every figure referenced by the README must exist
        run: |
          for f in 01_hero_forecast 02_all_cells 03_skill \
                   04_end_of_life 05_residuals 06_horizon; do
            test -s "figures/$f.png" || { echo "missing figures/$f.png"; exit 1; }
          done

  # The README tells people to press "Run all" in Colab. This is the job that
  # earns the right to say so. Only the Python notebook is executed: there is no
  # Julia or R runtime here, and the README states plainly that those two are
  # unverified rather than implying otherwise.
  notebook:
    name: the Python notebook actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"
      - name: Execute end to end
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            --output /tmp/executed.ipynb \
            notebooks/hybrid_digital_twin_python.ipynb
      - name: No cell may have errored
        run: |
          python - <<'PY'
          import json, sys
          nb = json.load(open("/tmp/executed.ipynb"))
          errs = [o for c in nb["cells"] for o in c.get("outputs", [])
                  if o.get("output_type") == "error"]
          figs = sum(1 for c in nb["cells"] for o in c.get("outputs", [])
                     if "image/png" in o.get("data", {}))
          print(f"cells: {len(nb['cells'])}, errors: {len(errs)}, figures: {figs}")
          if errs:
              print(errs[0].get("evalue"))
              sys.exit(1)
          if figs < 3:
              sys.exit("the notebook is meant to draw at least three figures")
          PY
