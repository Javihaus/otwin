[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otwin-hybrid"
version = "0.1.0"
description = "A hybrid digital twin for Li-ion state of health: physics, a Gaussian process and a learned residual, compared under one honest split."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Javier Marin", email = "javier@jmarin.info" }]
keywords = [
    "digital twin",
    "battery",
    "state of health",
    "hybrid model",
    "residual learning",
    "physics-informed machine learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# The tutorial is meant to run from a cold Colab runtime, so the required set is
# deliberately small. scikit-learn is required rather than optional because the
# Gaussian process is not a garnish -- it is one of the three models being
# compared, and the headline result is that it loses.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
examples = ["jupyter>=1.0", "nbconvert>=7.0", "nbformat>=5.9"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "black>=24.3",
    "nbconvert>=7.0",
    "nbformat>=5.9",
]

[project.urls]
Homepage = "https://github.com/otwin-core"
Documentation = "https://docs.otwin.dev/showcase/battery/"
Repository = "https://github.com/otwin-core/otwin-hybrid"
Issues = "https://github.com/otwin-core/otwin-hybrid/issues"
"Original post" = "https://towardsdatascience.com/how-to-build-a-digital-twin-b31058fd5d3e/"

[tool.hatch.build.targets.wheel]
packages = ["src/otwin_hybrid"]

# Ship the dataset inside the wheel. Without this, `pip install otwin-hybrid`
# produces a package that cannot find its own data, and `import
# otwin_hybrid.comparison` fails in a site-packages install. 30 KB is a fair
# price for the module being importable.
[tool.hatch.build.targets.wheel.force-include]
"data/battery_soh.csv" = "otwin_hybrid/data/battery_soh.csv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks are the deliverable here, not source. They are written to be read
# top to bottom on a phone-sized Colab pane, which means compact idioms the
# linter dislikes (`a = x; b = y`) and which are the right call for a tutorial.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "notebooks"

# A lambda is the clearest way to pass a one-line function to a numerical
# routine under test -- `numerical_gradient(lambda x: x[0]**2, ...)` reads
# better than a def three lines above the assertion. E731 is a good rule in
# library code and noise in tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731"]
